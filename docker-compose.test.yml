services:
  postgres-test:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: lokiini_test
      POSTGRES_USER: lokiini_test
      POSTGRES_PASSWORD: lokiini_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokiini_test -d lokiini_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  backend-test:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: test
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://lokiini_test:lokiini_test_password@postgres-test:5432/lokiini_test
      LOKIINI_TEST_DATABASE_URL: postgresql+asyncpg://lokiini_test:lokiini_test_password@postgres-test:5432/lokiini_test
      MEILISEARCH_MASTER_KEY: lokiini_test_search_key
      MEILISEARCH_URL: http://127.0.0.1:7700
      CORS_ALLOWED_ORIGINS: http://localhost
      PAYMENT_WEBHOOK_SECRET: test-payment-webhook-secret-32-characters-minimum
      DIDIT_API_KEY: test-didit-api-key
      DIDIT_WEBHOOK_SECRET: test-didit-webhook-secret
      DIDIT_WORKFLOW_ID: test-didit-workflow
      INSPECTION_EVIDENCE_DIR: /tmp/lokiini-inspection-evidence
      DISPUTE_EVIDENCE_DIR: /tmp/lokiini-dispute-evidence
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head && pytest -q"]
