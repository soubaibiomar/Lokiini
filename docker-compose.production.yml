services:
  migrate:
    build:
      target: production
    volumes: !reset []
  backend:
    build:
      target: production
    ports: !reset []
    volumes: !reset
      - equipment_media:/app/media
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SESSION_COOKIE_SECURE=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      - API_BASE_URL=${API_BASE_URL:?API_BASE_URL must be set}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID must be set}
      - DIDIT_API_KEY=${DIDIT_API_KEY:?DIDIT_API_KEY must be set}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET:?DIDIT_WEBHOOK_SECRET must be set}
      - DIDIT_WORKFLOW_ID=${DIDIT_WORKFLOW_ID:?DIDIT_WORKFLOW_ID must be set}
  frontend:
    build:
      target: production
    ports: !reset []
    volumes: !reset []
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  meilisearch:
    ports: !reset []
    environment:
      - MEILI_ENV=production
  n8n:
    ports: !reset []
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      - N8N_HOST=${N8N_HOST:?N8N_HOST must be set}
      - N8N_PROTOCOL=https
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL must be set}
  gateway:
    volumes:
      - ./docker/nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  lokiini_services:
    internal: true
