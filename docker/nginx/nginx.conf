events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # 1. API Backend Routing
        location /api/ {
            set $backend_target http://backend:8000;
            proxy_pass $backend_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Swagger Docs Backend Routing
        location /docs {
            set $backend_target http://backend:8000/docs;
            proxy_pass $backend_target;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend_target http://backend:8000/openapi.json;
            proxy_pass $backend_target;
            proxy_set_header Host $host;
        }

        # 3. n8n Automation Engine Routing
        location /n8n/ {
            set $n8n_target http://n8n:5678;
            proxy_pass $n8n_target/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Meilisearch Engine Routing
        location /search/ {
            set $meili_target http://meilisearch:7700;
            proxy_pass $meili_target/;
            proxy_set_header Host $host;
        }

        # 5. Frontend Web Application (Default)
        location / {
            set $frontend_target http://frontend:3000;
            proxy_pass $frontend_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
