version: '3.8'

services:
  gateway:
    image: nginx:alpine
    container_name: lokiini-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lokiini_network

  frontend:
    build:
      context: ./src/frontend/web
      dockerfile: Dockerfile
    container_name: lokiini-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - lokiini_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: lokiini-backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lokiini_user:lokiini_secure_pass_2026@postgres:5432/lokiini_db
      - REDIS_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=lokiini_meili_master_key_2026
      - DIDIT_API_KEY=didit_demo_api_key_morocco
      - DIDIT_WEBHOOK_SECRET=didit_webhook_secret_hmac_2026
      - SECRET_KEY=lokiini_jwt_super_secret_key_morocco_2026_cndp
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - lokiini_network

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: lokiini-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lokiini_db
      - POSTGRES_USER=lokiini_user
      - POSTGRES_PASSWORD=lokiini_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lokiini_network

  redis:
    image: redis:7-alpine
    container_name: lokiini-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lokiini_network

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lokiini-meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=lokiini_meili_master_key_2026
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    networks:
      - lokiini_network

  n8n:
    image: n8nio/n8n:latest
    container_name: lokiini-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lokiini_network

networks:
  lokiini_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meili_data:
  n8n_data:
